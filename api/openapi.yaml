openapi: 3.1.0
info:
  title: Clud API
  version: v1
servers:
- url: /
paths:
  /api/v1/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Server is healthy
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Database is unavailable
      tags:
      - Health
  /api/v1/setup:
    get:
      operationId: setupStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
          description: OK
      tags:
      - Setup
    post:
      operationId: setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
        required: true
      responses:
        "201":
          description: Administrator created; log in to start a session
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid account details
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Setup has already been completed
      tags:
      - Setup
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
      required:
      - status
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    SetupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          description: "Non-blank password, at most 72 bytes of UTF-8"
          maxLength: 72
          minLength: 1
        username:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "[A-Za-z0-9._-]+"
      required:
      - password
      - username
    SetupStatus:
      type: object
      properties:
        setupNeeded:
          type: boolean
      required:
      - setupNeeded
