openapi: 3.1.0
info:
  title: Clud API
  version: v1
servers:
- url: /
paths:
  /api/v1/auth/csrf:
    get:
      description: "Returns a CSRF token and its header name, creating an anonymous\
        \ session if needed. Keep the SESSION cookie and send the token on login and\
        \ logout. Fetch a fresh token after either operation."
      operationId: csrfToken
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
          description: OK
      tags:
      - Authentication
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "204":
          description: Logged in; session cookie issued
          headers:
            Set-Cookie:
              description: "SESSION cookie; HttpOnly, Secure, SameSite=Lax"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid login request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid credentials or disabled account
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid CSRF token
      tags:
      - Authentication
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Logged out; session invalidated
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid CSRF token
      tags:
      - Authentication
  /api/v1/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Server is healthy
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Database is unavailable
      tags:
      - Health
  /api/v1/setup:
    get:
      operationId: setupStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
          description: OK
      tags:
      - Setup
    post:
      operationId: setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
        required: true
      responses:
        "201":
          description: Administrator created; log in to start a session
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid account details
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Setup has already been completed
      tags:
      - Setup
components:
  schemas:
    CsrfResponse:
      type: object
      properties:
        headerName:
          type: string
        token:
          type: string
      required:
      - headerName
      - token
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
      required:
      - status
    LoginRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          description: At most 72 bytes of UTF-8
          maxLength: 72
          minLength: 1
        username:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "[A-Za-z0-9._-]+"
      required:
      - password
      - username
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    SetupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          description: "Non-blank password, at most 72 bytes of UTF-8"
          maxLength: 72
          minLength: 1
        username:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "[A-Za-z0-9._-]+"
      required:
      - password
      - username
    SetupStatus:
      type: object
      properties:
        setupNeeded:
          type: boolean
      required:
      - setupNeeded
