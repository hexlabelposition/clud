spring:
  application:
    name: server
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?currentSchema=${POSTGRES_SCHEMA:public}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    schemas: ${POSTGRES_SCHEMA:public}
  session:
    timeout: 30m
    jdbc:
      # Flyway owns the Spring Session tables (V2).
      initialize-schema: never
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        http-only: true
        # Secure is derived from the scheme of clud.public-url.
        same-site: lax

springdoc:
  api-docs:
    path: /api/v1/openapi
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

# Bound from CLUD_* environment variables, e.g. CLUD_PUBLIC_URL → clud.public-url.
clud:
  public-url: http://localhost
