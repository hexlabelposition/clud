name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Includes OpenApiSpecTests, which fails if api/openapi.yaml is out of date.
      - run: ./gradlew build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check the generated API client is up to date
        run: pnpm generate:api && git diff --exit-code src/lib/api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - name: Pull the Playwright image
        run: bash ../.github/scripts/playwright.sh pull
      - name: Test the Web dev server in the Playwright image
        timeout-minutes: 5
        run: bash ../.github/scripts/playwright.sh
      - name: Upload Web test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-failure-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Check the generated API client is up to date
        run: go generate ./... && git diff --exit-code .
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test ./...
      - run: go build ./cmd/clud

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: clud-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CLUD_PUBLIC_URL: http://localhost
      PLAYWRIGHT_BASE_URL: http://localhost
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build production images
        run: docker compose build
      # Each run gets its own project and fresh database volume.
      - name: Start the Compose stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Wait for Server health through Caddy
        timeout-minutes: 3
        run: >-
          curl --fail --silent --show-error
          --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 120
          --max-time 5 "$CLUD_PUBLIC_URL/api/v1/health"
      - name: Pull the Playwright image
        run: bash ../.github/scripts/playwright.sh pull
        working-directory: web
      - name: Test the production stack through Caddy
        timeout-minutes: 5
        run: bash ../.github/scripts/playwright.sh
        working-directory: web
      - name: Collect Compose diagnostics
        if: failure()
        run: |
          mkdir -p compose-diagnostics
          docker compose ps -a > compose-diagnostics/status.txt
          docker compose logs --no-color --timestamps > compose-diagnostics/compose.log 2>&1
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-failure-diagnostics
          path: |
            compose-diagnostics/
            web/playwright-report/
            web/test-results/
          retention-days: 7
      - name: Remove the Compose stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
